<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Blog</title>

  <style>
    :root {
      --bg: #0f0f0f;
      --surface: #1a1a1a;
      --text: #e8e8e8;
      --muted: #9a9a9a;
      --accent: #ffffff;
      --border: #2a2a2a;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      font-size: 16px;
      line-height: 1.7;
    }

    .container {
      max-width: 720px;
      margin: 0 auto;
      padding: 60px 24px 80px;
    }

    header {
      margin-bottom: 48px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 32px;
    }

    header h1 {
      font-size: 2rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: var(--accent);
    }

    header p {
      margin-top: 8px;
      color: var(--muted);
      font-size: 0.95rem;
    }

    .post-list {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .post {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      transition: border-color 0.2s ease;
    }

    .post:hover {
      border-color: #404040;
    }

    .post a {
      display: block;
      padding: 20px 24px;
      text-decoration: none;
      color: inherit;
    }

    .post-title {
      font-size: 1.1rem;
      font-weight: 600;
      color: var(--accent);
    }

    .post-date {
      margin-top: 4px;
      color: var(--muted);
      font-size: 0.9rem;
    }

    .post-description {
      margin-top: 10px;
      color: var(--text);
      font-size: 0.95rem;
    }

    footer {
      border-top: 1px solid var(--border);
      margin-top: 48px;
      padding-top: 24px;
      color: var(--muted);
      font-size: 0.85rem;
    }
  </style>
</head>
<body>

  <div class="container">

    <header>
      <h1>Blog</h1>
      <p>Thoughts, projects, experiments, and notes.</p>
    </header>

    <div class="post-list" id="posts"></div>

    <footer>
      <p>1 post published.</p>
    </footer>

  </div>

  <script>
    const posts = [
      {
        title: "My portfolio redesign",
        file: "portfolio-redesign.html",
        date: "June 22, 2026",
        description: "A test post used to build and validate the blog system, and talk about the redesign"
      }
    ];

    const container = document.getElementById("posts");

    posts.forEach(post => {
      const article = document.createElement("article");
      article.className = "post";

      article.innerHTML = `
        <a href="${post.file}">
          <div class="post-title">${post.title}</div>
          <div class="post-date">${post.date}</div>
          <div class="post-description">${post.description}</div>
        </a>
      `;

      container.appendChild(article);
    });
  </script>

</body>
</html>
