<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Taksha Patel</title>
  <style>
    :root {
      --bg: #0f0f0f;
      --surface: #181818;
      --text: #eeeeee;
      --muted: #9a9a9a;
      --accent: #ffffff;
      --border: #2a2a2a;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      font-size: 16px;
      line-height: 1.7;
    }

    .container {
      max-width: 720px;
      margin: 0 auto;
      padding: 60px 24px 80px;
    }

    header {
      margin-bottom: 32px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 24px;
    }

    header h1 {
      font-size: 2rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: var(--accent);
    }

    header p {
      margin-top: 8px;
      color: var(--muted);
      font-size: 0.95rem;
    }

    .choices {
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
      margin-top: 20px;
    }

    .choices a {
      color: var(--text);
      text-decoration: none;
      border-bottom: 1px solid var(--border);
      padding-bottom: 4px;
    }

    .choices a:hover {
      color: var(--accent);
      border-color: var(--accent);
    }

    .note {
      margin-top: 24px;
      color: var(--muted);
      font-size: 0.95rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>Taksha Patel</h1>
      <p>This site has two versions. One is more professional, the other is more personal.</p>
    </header>

    <div class="choices">
      <a href="professional.html">Professional site</a>
      <a href="personal.html">Personal site</a>
    </div>

    <p class="note">The professional page is the more polished portfolio version. The personal page is simpler and more direct.</p>
  </div>
</body>
</html>
